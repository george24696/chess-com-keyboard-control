<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard Control</title>
<style>
  body { margin: 0; width: 260px; padding: 14px; background: #1f1e1b; color: #f1efe9; font: 14px system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  select { background: #151412; color: #f1efe9; border: 1px solid #45443f; border-radius: 6px; padding: 4px 6px; font: inherit; max-width: 150px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: #81b64c; }
  button { width: 100%; background: #81b64c; color: #10200a; border: 0; border-radius: 6px; padding: 8px; font: 700 14px system-ui; cursor: pointer; }
  button:hover { background: #95c85f; }
</style>
</head>
<body>
  <h1>Chess.com Keyboard Control</h1>
  <label>Enabled <input type="checkbox" id="enabled"></label>
  <label>Layout <select id="layout"></select></label>
  <button id="open">Open settings and test board</button>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
